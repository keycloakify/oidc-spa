services:
    app:
        image: oidc-spa-tanstack-start-ssr:local
        build:
            context: .
        ports:
            - "${SELF_HOSTED_PORT:-3000}:3000"
        env_file:
            - ${SELF_HOSTED_ENV_FILE:-../.env}
        volumes:
            - todos:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "const s = require('node:net').connect(3000, '127.0.0.1', () => s.end()); s.on('error', () => process.exit(1));"
                ]
            interval: 5s
            timeout: 3s
            start_period: 10s
            retries: 5
        init: true
        restart: unless-stopped

volumes:
    todos:
