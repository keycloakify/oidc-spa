services:
    frontend:
        image: oidc-spa-tanstack-start-frontend:local
        build:
            context: ./self-hosted
            target: frontend
        ports:
            - "${SELF_HOSTED_PORT:-3000}:80"
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

    backend:
        image: oidc-spa-tanstack-start-backend:local
        build:
            context: ./self-hosted
            target: backend
        env_file:
            - ${SELF_HOSTED_ENV_FILE:-.env}
        volumes:
            - todos:/data
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "const s = require('node:net').connect(3000, '127.0.0.1', () => s.end()); s.on('error', () => process.exit(1));"
                ]
            interval: 5s
            timeout: 3s
            start_period: 10s
            retries: 5
        init: true
        restart: unless-stopped

volumes:
    todos:
