# Preserve HTTPS when a trusted TLS-terminating proxy sits in front of Nginx.
# That proxy must overwrite X-Forwarded-Proto with the original request scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

# Re-resolve the backend if Compose replaces its container with a new IP address.
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
upstream nitro_backend {
    zone nitro_backend 64k;
    server backend:3000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These are the only requests that reach Node. Keep the URI and query intact.
    location ~ ^/(?:api|_serverFn)(?:/|$) {
        proxy_pass http://nitro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # Internal rewrite: the browser keeps /openid-callback/, its query, and fragment.
    location = /openid-callback/ {
        rewrite ^ /_shell.html last;
    }

    location = /_shell.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed assets. Missing assets should be real 404s.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve prerendered pages first; other frontend URLs receive the neutral shell.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /_shell.html;
    }
}
